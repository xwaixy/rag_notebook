services:
  backend:
    volumes:
      - ./backend:/app
      - backend_venv:/app/.venv
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    command: uv run uvicorn main:app --host 0.0.0.0 --port 8000 --reload

  django:
    volumes:
      - ./DjangoUserService:/app
      - django_venv:/app/.venv
      - django_media:/app/media
    command: sh -c "uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8001"

  front:
    build:
      context: ./front
      dockerfile: Dockerfile.dev
    working_dir: /app
    environment:
      PATH: "/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin"
      VITE_BACKEND_TARGET: http://backend:8000
      VITE_USER_TARGET: http://django:8001
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./front:/app
      - front_node_modules:/app/node_modules
    command: sh -c "node --version && npm --version && npm config set registry https://registry.npmmirror.com && npm install && npm run dev -- --host 0.0.0.0 --port 80"

volumes:
  backend_venv:
  django_venv:
  front_node_modules:
